<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>marlwood</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Mono:wght@300;400;500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">

<script type="module">
// Конфигурация Firebase
const firebaseConfig = {
  apiKey: "AIzaSyBs2ghw1_7tdemNwkGAU8I99Untqz5eLiU",
  authDomain: "marlwood-f0dd0.firebaseapp.com",
  projectId: "marlwood-f0dd0",
  storageBucket: "marlwood-f0dd0.firebasestorage.app",
  messagingSenderId: "832709912787",
  appId: "1:832709912787:web:afa64fd34441497d918c26",
  databaseURL: "https://marlwood-f0dd0-default-rtdb.firebaseio.com/"
};

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, doc, setDoc, getDoc, addDoc, onSnapshot, updateDoc, serverTimestamp, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getDatabase, ref, set, onDisconnect } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const rdb = getDatabase(app);

const ROOM_ID = "room-main";
let myUid = null;
let userData = null;
let ytPlayer = null;
let isBroadcasting = false;

// Вспомогательная функция для уведомлений (toast)
const toast = (msg) => {
    const t = document.createElement('div');
    t.className = 'toast';
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 2200);
};

// --- AUTH LOGIC ---
window.handleAuth = async (mode) => {
    const email = document.getElementById('auth-email').value;
    const pass = document.getElementById('auth-pass').value;
    const username = document.getElementById('auth-nick').value;
    
    if (!email || !pass) { toast("Fill email and password"); return; }

    try {
        if (mode === 'signup') {
            const res = await createUserWithEmailAndPassword(auth, email, pass);
            const location = username === 'dxxsmxrl' ? "🇺🇸 Los Angeles, USA" : "📍 Earth";
            userData = { uid: res.user.uid, username, location, avatar: "", joinedAt: new Date().toISOString() };
            await setDoc(doc(db, "users", res.user.uid), userData);
        } else {
            await signInWithEmailAndPassword(auth, email, pass);
        }
    } catch (e) {
        toast("Error: " + e.message);
    }
};

onAuthStateChanged(auth, async user => {
    if (user) {
        myUid = user.uid;
        const snap = await getDoc(doc(db, "users", myUid));
        userData = snap.data() || { username: "User", location: "Earth" };
        document.getElementById('auth').classList.remove('on');
        document.getElementById('main').classList.add('on');
        startSync();
    } else {
        document.getElementById('auth').classList.add('on');
        document.getElementById('main').classList.remove('on');
    }
});

// --- YOUTUBE SYNC ---
window.onYouTubeIframeAPIReady = () => {
    ytPlayer = new YT.Player('player', { // ID из твоего HTML
        events: { 'onStateChange': onPlayerStateChange }
    });
};

async function onPlayerStateChange(event) {
    if (isBroadcasting) return;
    const state = event.data === YT.PlayerState.PLAYING ? 'play' : 'pause';
    const time = ytPlayer.getCurrentTime();
    await updateDoc(doc(db, "rooms", ROOM_ID), { 
        playerState: state, 
        currentTime: time, 
        lastChangeBy: myUid,
        ts: serverTimestamp() 
    }).catch(async () => {
        // Если комнаты еще нет - создаем
        await setDoc(doc(db, "rooms", ROOM_ID), { playerState: state, currentTime: time, lastChangeBy: myUid });
    });
}

function startSync() {
    // Presence
    const presRef = ref(rdb, `rooms/${ROOM_ID}/presence/${myUid}`);
    set(presRef, { username: userData.username, online: true });
    onDisconnect(presRef).remove();

    // Видео
    onSnapshot(doc(db, "rooms", ROOM_ID), snap => {
        const data = snap.data();
        if (!data || data.lastChangeBy === myUid || !ytPlayer) return;
        isBroadcasting = true;
        if (data.playerState === 'play') ytPlayer.playVideo();
        else ytPlayer.pauseVideo();
        if (Math.abs(ytPlayer.getCurrentTime() - data.currentTime) > 2) ytPlayer.seekTo(data.currentTime);
        setTimeout(() => isBroadcasting = false, 600);
    });

    // Чат
    const q = query(collection(db, "rooms", ROOM_ID, "messages"), orderBy("ts", "asc"), limit(50));
    onSnapshot(q, snap => {
        const box = document.getElementById('chat-scroll');
        if (!box) return;
        box.innerHTML = '';
        snap.forEach(doc => {
            const m = doc.data();
            box.innerHTML += `<div class="msg"><b>${m.senderName}:</b> ${m.text}</div>`;
        });
        box.scrollTop = box.scrollHeight;
    });
}

// Отправка сообщения (для твоей кнопки Send)
window.sendMsg = async () => {
    const input = document.getElementById('chat-input');
    if (!input.value) return;
    await addDoc(collection(db, "rooms", ROOM_ID, "messages"), {
        text: input.value,
        senderName: userData.username,
        ts: serverTimestamp()
    });
    input.value = '';
};

// Твои функции красоты (оставляем)
window.toggleTheme = () => document.body.classList.toggle('lt');
</script>
<script src="https://www.youtube.com/iframe_api"></script>

<style>
/* ТУТ ВСЕ ТВОИ СТИЛИ ИЗ ОРИГИНАЛА - Я ИХ ОСТАВЛЯЮ */
:root {
  --bg:#0a0a0a; --s1:#111; --s2:#181818; --s3:#222;
  --b1:#2a2a2a; --b2:#363636; --t1:#f0f0f0; --t2:#888; --t3:#444;
  --r:12px; --rs:8px; --acc:#f0f0f0;
}
.lt {
  --bg:#f5f5f3; --s1:#fff; --s2:#f2f2f0; --s3:#e8e8e5;
  --b1:#ddd; --b2:#ccc; --t1:#111; --t2:#777; --t3:#bbb;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--t1);height:100vh;overflow:hidden;transition:background .25s,color .25s;font-size:14px;}
.screen{display:none;height:100vh;flex-direction:column;}
.screen.on{display:flex;}
#auth{align-items:center;justify-content:center;position:fixed;inset:0;z-index:9999;background:var(--bg);}
.auth-card{background:var(--s1);border:1px solid var(--b1);border-radius:18px;padding:40px;width:380px;}
.logo{font-family:'Playfair Display',serif;font-size:30px;margin-bottom:20px;text-align:center;}
input{width:100%;padding:12px;margin-bottom:10px;background:var(--s2);border:1px solid var(--b1);border-radius:8px;color:#fff;}
.btn{width:100%;padding:12px;background:var(--t1);color:var(--bg);border:none;border-radius:8px;cursor:pointer;font-weight:600;}
#main{display:none;height:100vh;}
#main.on{display:flex;}
.video-area{flex:3;background:#000;position:relative;}
.chat-area{flex:1;border-left:1px solid var(--b1);display:flex;flex-direction:column;background:var(--s1);}
#chat-scroll{flex:1;overflow-y:auto;padding:15px;}
.chat-input-wrap{padding:15px;border-top:1px solid var(--b1);display:flex;gap:10px;}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#fff;color:#000;padding:8px 16px;border-radius:20px;font-size:12px;}
</style>
</head>
<body>

<div id="auth" class="screen on">
    <div class="auth-card">
        <div class="logo">marlwood</div>
        <input type="text" id="auth-nick" placeholder="Username (for signup)">
        <input type="email" id="auth-email" placeholder="Email">
        <input type="password" id="auth-pass" placeholder="Password">
        <button class="btn" onclick="handleAuth('login')">Login</button>
        <button class="btn" onclick="handleAuth('signup')" style="margin-top:8px; background:var(--s3); color:var(--t2)">Sign Up</button>
    </div>
</div>

<div id="main" class="screen">
    <div class="video-area">
        <div id="player" style="width:100%; height:100%"></div>
    </div>
    <div class="chat-area">
        <div id="chat-scroll"></div>
        <div class="chat-input-wrap">
            <input type="text" id="chat-input" placeholder="Message...">
            <button class="btn" style="width:auto" onclick="sendMsg()">Send</button>
        </div>
    </div>
</div>

</body>
</html>
